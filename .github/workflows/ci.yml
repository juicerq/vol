name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(bun -p 'require("./package.json").version')"
      - run: bun run check
      - run: bun run lint
      - run: bun run xpi
      - run: bun run lint:extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vol-firefox-${{ github.sha }}
          path: |
            .output/vol.xpi
            .output/vol-*-sources.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: vol-firefox-${{ github.sha }}
          path: package
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mv package/vol.xpi "package/vol-${TAG#v}.xpi"
          gh release create "$TAG" package/* --verify-tag --draft --generate-notes --title "Vol $TAG" --notes 'Pacote sem assinatura Mozilla. Consulte o README para instalação, compatibilidade e limitações.'
